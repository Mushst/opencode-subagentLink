[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-subagentlink"
dynamic = ["version"]
description = "Unofficial. Delegate tasks from Claude Code to your OpenCode V2 agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Mushst/opencode-subagentLink"

[project.scripts]
opencode-subagentlink = "opencode_subagentlink.cli:main"

[tool.setuptools.dynamic]
version = {attr = "opencode_subagentlink.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
